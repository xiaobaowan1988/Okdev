apiVersion: v1
kind: Namespace
metadata:
  name: okdev-system
---
# 发布任务只在这个命名空间里生效:控制器只监听它,研发只在这里有创建权限
apiVersion: v1
kind: Namespace
metadata:
  name: okdev-releases
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: okdev-controller
  namespace: okdev-system
---
# 控制器只读写发布任务和事件;构建、部署由 deployer 完成,所以不需要 Job、Pod 等权限
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: okdev-controller
  namespace: okdev-releases
rules:
  - apiGroups: [ci.okdev.io]
    resources: [releasetasks]
    verbs: [get, list, watch]
  - apiGroups: [ci.okdev.io]
    resources: [releasetasks/status]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: okdev-controller
  namespace: okdev-releases
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: okdev-controller}
subjects: [{kind: ServiceAccount, name: okdev-controller, namespace: okdev-system}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: okdev-leader-election
  namespace: okdev-system
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: okdev-leader-election
  namespace: okdev-system
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: okdev-leader-election}
subjects: [{kind: ServiceAccount, name: okdev-controller, namespace: okdev-system}]
