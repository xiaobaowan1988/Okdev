apiVersion: v1
kind: Namespace
metadata:
  name: okdev-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: okdev-controller
  namespace: okdev-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: okdev-controller
rules:
  - apiGroups: [ci.okdev.io]
    resources: [releasetasks]
    verbs: [get, list, watch]
  - apiGroups: [ci.okdev.io]
    resources: [releasetasks/status]
    verbs: [get, update, patch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create]
  # 创建带 ownerReference 的 Job 时,准入要求对属主有 finalizers 更新权限
  - apiGroups: [ci.okdev.io]
    resources: [releasetasks/finalizers]
    verbs: [update]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: okdev-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: okdev-controller
subjects:
  - kind: ServiceAccount
    name: okdev-controller
    namespace: okdev-system
---
# 研发人员:能创建和查看 ReleaseTask(Headlamp 里"点击运行"所需),不能改 status
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: okdev-releasetask-editor
rules:
  - apiGroups: [ci.okdev.io]
    resources: [releasetasks]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
