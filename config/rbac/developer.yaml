# 研发人员的权限,三部分:
# 1. okdev-release-submitter(Role,只在 okdev-releases 命名空间):创建、查看、删除发布任务,看任务事件。
# 2. okdev-developer(ClusterRole):列出集群的命名空间(Headlamp 下拉和原生页面用)、进容器终端。
# 3. okdev-console-reader(Role,只在 okdev-system 命名空间):经服务代理读控制器的只读接口(环境、构建器、分支、日志)。
# 再配合内置的 view(只读工作负载/Pod/日志,不含 Secret)。绑定见 deploy/dex-sandbox/developers.yaml。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: okdev-release-submitter
  namespace: okdev-releases
rules:
  - apiGroups: [ci.okdev.io]
    resources: [releasetasks]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: okdev-developer
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: okdev-console-reader
  namespace: okdev-system
rules:
  - apiGroups: [""]
    resources: [services/proxy]
    resourceNames: ["okdev-controller:http"]
    verbs: [get]
