apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: releasetasks.ci.okdev.io
spec:
  group: ci.okdev.io
  scope: Namespaced
  names:
    kind: ReleaseTask
    listKind: ReleaseTaskList
    plural: releasetasks
    singular: releasetask
    shortNames: [rt]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Service, type: string, jsonPath: .spec.service.name}
        - {name: Env, type: string, jsonPath: .spec.environment}
        - {name: Ref, type: string, jsonPath: .spec.git.ref}
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Pod, type: string, jsonPath: .status.executorPodName}
        - {name: Age, type: date, jsonPath: .metadata.creationTimestamp}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [service, environment, git]
              properties:
                service:
                  type: object
                  required: [name, kind]
                  properties:
                    name: {type: string, minLength: 1}
                    kind: {type: string, enum: [Deployment, StatefulSet, CronJob, Job]}
                environment: {type: string, minLength: 1}
                git:
                  type: object
                  required: [repo, ref]
                  properties:
                    repo: {type: string, minLength: 1}
                    ref: {type: string, minLength: 1}
                gitops:
                  type: object
                  required: [repo]
                  properties:
                    repo: {type: string}
                    branch: {type: string}
                    path: {type: string}
                executor:
                  type: object
                  properties:
                    image: {type: string}
                    command: {type: array, items: {type: string}}
                timeoutSeconds: {type: integer, minimum: 0}
              x-kubernetes-validations:
                - rule: "self == oldSelf"
                  message: spec is immutable; create a new ReleaseTask instead
            status:
              type: object
              properties:
                phase: {type: string, enum: [Pending, Running, Success, Failed]}
                jobName: {type: string}
                executorPodName: {type: string}
                message: {type: string}
                startTime: {type: string, format: date-time}
                completionTime: {type: string, format: date-time}
