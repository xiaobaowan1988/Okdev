apiVersion: apps/v1
kind: Deployment
metadata:
  name: okdev-controller
  namespace: okdev-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: okdev-controller}
  template:
    metadata:
      labels: {app: okdev-controller}
    spec:
      serviceAccountName: okdev-controller
      containers:
        - name: controller
          image: okdev-controller:latest
          args:
            - --namespace=okdev-releases
            - --deployer-url=http://deployer.deployer.svc:8080
            - --leader-elect
          ports: [{name: http, containerPort: 8080}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
