# 沙箱单节点集群(myk8s)的覆盖:控制器镜像用 scripts/build-controller.sh 导入的本地镜像。deployer、registry、Argo CD 由 myk8s 提供。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../config
patches:
  - target: {kind: Deployment, name: okdev-controller}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: okdev-controller:dev
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
