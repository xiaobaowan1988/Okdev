# 沙箱:issuer 是 NodePort 地址,回调地址是 port-forward 的 localhost:4466。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../headlamp-dex]
patches:
  - target: {kind: Deployment, name: headlamp}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/env/0/value, value: "https://192.0.2.2:30556"}
      - {op: replace, path: /spec/template/spec/containers/0/env/2/value, value: "http://localhost:4466/oidc-callback"}
