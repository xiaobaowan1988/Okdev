{{ template "header.html" . }}

<div class="theme-panel">
  <h2 class="theme-heading">登录</h2>
  <form method="post" action="{{ .PostURL }}">
    <div class="theme-form-row">
      <div class="theme-form-label">
        <label for="login">用户名或邮箱</label>
      </div>
      <input tabindex="1" required id="login" name="login" type="text" class="theme-form-input" placeholder="Zadig 用户名或邮箱" autocomplete="username" {{ if .Username }} value="{{ .Username }}" {{ else }} autofocus {{ end }}/>
    </div>
    <div class="theme-form-row">
      <div class="theme-form-label">
        <label for="password">密码</label>
      </div>
      <input tabindex="2" required id="password" name="password" type="password" class="theme-form-input" placeholder="密码" autocomplete="current-password" {{ if .Invalid }} autofocus {{ end }}/>
    </div>

    {{ if .Invalid }}
      <div id="login-error" class="dex-error-box">
        用户名/邮箱或密码错误。
      </div>
    {{ end }}

    <button tabindex="3" id="submit-login" type="submit" class="dex-btn theme-btn--primary">登录</button>
  </form>
</div>

<script type="text/javascript">
  document.querySelector('form').onsubmit = function(e) {
    document.querySelector('#submit-login').setAttribute('disabled', 'disabled');
  };
</script>

{{ template "footer.html" . }}
