# 集群内 Headlamp + okdev 插件(插件文件由 scripts/deploy-headlamp.sh 放进 ConfigMap okdev-plugin)。
apiVersion: v1
kind: ServiceAccount
metadata: {name: headlamp, namespace: okdev-system}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: headlamp, namespace: okdev-system}
spec:
  replicas: 1
  selector: {matchLabels: {app: headlamp}}
  template:
    metadata: {labels: {app: headlamp}}
    spec:
      serviceAccountName: headlamp
      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp:latest
          args: [-in-cluster, -plugins-dir=/headlamp/plugins]
          ports: [{containerPort: 4466}]
          readinessProbe: {httpGet: {path: /, port: 4466}}
          volumeMounts:
            - {name: plugin, mountPath: /headlamp/plugins/okdev-console}
      volumes:
        - name: plugin
          configMap: {name: okdev-plugin}
---
apiVersion: v1
kind: Service
metadata: {name: headlamp, namespace: okdev-system}
spec:
  selector: {app: headlamp}
  ports: [{port: 80, targetPort: 4466}]
