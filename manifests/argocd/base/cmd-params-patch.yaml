# 开启 "Apps in Any Namespace" 与 "ApplicationSet in any namespace"
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
data:
  application.namespaces: "argocd, argocd-apps-*"
  applicationsetcontroller.namespaces: "argocd, argocd-apps-*"
  # 跨命名空间的 ApplicationSet 要求:关闭 SCM provider 生成器,或配置 allowed.scm.providers
  applicationsetcontroller.enable.scm.providers: "false"
