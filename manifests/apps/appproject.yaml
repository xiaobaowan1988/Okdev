apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
spec:
  description: Applications managed by deployer (all environments)
  # 项目默认不允许任何源仓库,必须显式列出
  sourceRepos:
    - https://github.com/xiaobaowan1988/argocd-example-apps.git
  # 只允许部署到本集群的 <环境>-env-<应用> 命名空间。环境间不做 Argo CD 层面的隔离(同一集群、不需要隔离)
  destinations:
    - namespace: '*-env-*'
      server: https://kubernetes.default.svc
  # 集群级资源只放行 Namespace(CreateNamespace=true 需要),其余默认禁止
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
