apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployer
  namespace: deployer
spec:
  replicas: 1   # 对账用 MySQL GET_LOCK 选主,可以安全地调大
  selector:
    matchLabels: {app: deployer}
  template:
    metadata:
      labels: {app: deployer}
    spec:
      serviceAccountName: deployer
      containers:
        - name: deployer
          image: deployer:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_PASSWORD
              valueFrom: {secretKeyRef: {name: deployer-mysql, key: password}}
            # 可选:创建 Secret deployer-api(key: token)后 API 要求 Bearer token;原型默认不开
            - name: API_TOKEN
              valueFrom: {secretKeyRef: {name: deployer-api, key: token, optional: true}}
            # 流水线(构建)配置;不写就用代码里的默认值。BUILD_CA_CONFIGMAP 指向的 ConfigMap 不存在也没关系(挂载是 optional 的)
            - {name: BUILD_NAMESPACE, value: deployer-build}
            - {name: REGISTRY_PUSH_HOST, value: "registry.deployer-build.svc:5000"}
            - {name: REGISTRY_PULL_HOST, value: "localhost:30500"}
            - {name: BUILD_CA_CONFIGMAP, value: build-ca}
            # Application 都放 argocd 命名空间、绑 AppProject apps(默认值,可用 APP_NAMESPACE / ARGOCD_PROJECT 改)
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: deployer
  namespace: deployer
spec:
  selector: {app: deployer}
  ports:
    - port: 8080
