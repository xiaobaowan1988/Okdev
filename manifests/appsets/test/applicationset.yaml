# 演示:一个 ApplicationSet 按目录批量生成 Application。
# 生成的 Application 与 ApplicationSet 在同一命名空间,所以每个环境一个 ApplicationSet,
# Namespace 由应用目录里的 namespace.yaml 提供(随 Application 一起创建/删除)。
# 放在各自的配置命名空间(Apps in Any Namespace),并绑定该环境的 AppProject。
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: demo-apps
  namespace: argocd-apps-test
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/xiaobaowan1988/argocd-example-apps.git
        revision: HEAD
        directories:
          - path: demo/*
  template:
    metadata:
      name: '{{.path.basename}}-test'
      # 删除 Application 时级联删除它部署的资源
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: project-test
      source:
        repoURL: https://github.com/xiaobaowan1988/argocd-example-apps.git
        targetRevision: HEAD
        path: '{{.path.path}}'
        kustomize:
          # 把目录里 namespace.yaml 的占位名改成实际命名空间
          namespace: 'test-env-{{.path.basename}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'test-env-{{.path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
