# 演示:一个 ApplicationSet 管理所有开发环境(同一集群的不同命名空间,环境间不需要隔离)。
# 部署标记 demo/<应用>/envs/<环境>.yaml:文件存在 = 该应用部署到该环境,环境名取自文件名(如 dev3)。
# 新增环境不用改这里,只要有应用放 envs/devN.yaml;删除文件即从该环境下线。
# 生成的 Application 与 ApplicationSet 在同一命名空间(argocd-apps-dev),名字是 <应用>-<环境>。
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: demo-apps
  namespace: argocd-apps-dev
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/xiaobaowan1988/argocd-example-apps.git
        revision: HEAD
        # files 生成器的 path.path 是标记文件所在目录(demo/<应用>/envs),应用目录要取上一级
        # 只匹配 dev*.yaml,test.yaml 由 test 的 ApplicationSet 处理
        files:
          - path: demo/*/envs/dev*.yaml
  template:
    metadata:
      # 例: app-a-dev3
      name: '{{ base (dir .path.path) }}-{{ trimSuffix ".yaml" .path.filename }}'
      # 删除 Application 时级联删除它部署的资源
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: project-dev
      source:
        repoURL: https://github.com/xiaobaowan1988/argocd-example-apps.git
        targetRevision: HEAD
        path: '{{ dir .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        # 例: dev3-env-app-a(匹配 project-dev 的 dev*-env-*)
        namespace: '{{ trimSuffix ".yaml" .path.filename }}-env-{{ base (dir .path.path) }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true # 命名空间不存在时自动创建;不归应用管理,删应用时保留
