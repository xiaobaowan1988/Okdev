# 演示:一个 ApplicationSet 按目录批量生成 Application。
# 生成的 Application 与 ApplicationSet 在同一命名空间,所以每个环境一个 ApplicationSet,
# 放在各自的配置命名空间(Apps in Any Namespace),并绑定该环境的 AppProject。
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: demo-apps
  namespace: argocd-apps-dev
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/xiaobaowan1988/argocd-example-apps.git
        revision: HEAD
        # 只有存在 envs/dev.yaml 的应用才会部署到 dev(删文件即下线)
        # 注意:files 生成器的 path.path 是标记文件所在目录(demo/<应用>/envs),应用目录要取上一级
        files:
          - path: demo/*/envs/dev.yaml
  template:
    metadata:
      name: '{{ base (dir .path.path) }}-dev'
      # 删除 Application 时级联删除它部署的资源
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: project-dev
      source:
        repoURL: https://github.com/xiaobaowan1988/argocd-example-apps.git
        targetRevision: HEAD
        path: '{{ dir .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'dev-env-{{ base (dir .path.path) }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true # 命名空间不存在时自动创建;不归应用管理,删应用时保留
