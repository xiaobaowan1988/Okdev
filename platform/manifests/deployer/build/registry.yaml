# 集群内镜像仓库(原型:单实例、无鉴权、HTTP、数据放节点 hostPath)。
# 构建任务从集群内用 registry.deployer-build.svc:5000 推送;节点上的 containerd 通过 NodePort 用 localhost:30500 拉取
# (containerd 的 CRI 对 localhost 默认允许明文 HTTP,所以不用额外配置)。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: deployer-build
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: registry}
  template:
    metadata:
      labels: {app: registry}
    spec:
      containers:
        - name: registry
          image: mirror.gcr.io/library/registry:2
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: {path: /v2/, port: 5000}
          volumeMounts:
            - {name: data, mountPath: /var/lib/registry}
      volumes:
        - name: data
          hostPath: {path: /var/lib/deployer-registry, type: DirectoryOrCreate}
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: deployer-build
spec:
  type: NodePort
  selector: {app: registry}
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
