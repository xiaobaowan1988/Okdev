# 测试用:模拟 Zadig 的用户库(仅沙箱验证,数据放 emptyDir,密码是测试值)。
apiVersion: v1
kind: Namespace
metadata: {name: zadig-test}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mysql, namespace: zadig-test}
spec:
  replicas: 1
  selector: {matchLabels: {app: mysql}}
  template:
    metadata: {labels: {app: mysql}}
    spec:
      containers:
        - name: mysql
          image: mirror.gcr.io/library/mysql:8.4
          env: [{name: MYSQL_ROOT_PASSWORD, value: test-only}]
          ports: [{containerPort: 3306}]
          readinessProbe:
            exec: {command: ["sh", "-c", "mysqladmin ping -uroot -ptest-only --silent"]}
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: {name: mysql, namespace: zadig-test}
spec:
  selector: {app: mysql}
  ports: [{port: 3306}]
